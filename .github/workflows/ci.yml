# .github/workflows/ci.yml — Entrega 2
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Build (gate tsc)
        run: npm run build
      - name: Tests unitarios
        run: npx vitest run
      - name: Lint (no bloqueante durante estabilización)
        run: npm run lint
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias Python
        run: pip install -r api/requirements.txt
      - name: Gate de sintaxis del backend
        run: python -m py_compile api/main.py api/test_keys.py